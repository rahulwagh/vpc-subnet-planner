      CidrBlock: 10.255.0.0/26
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${Name}-firewall-a" }, { Key: Tier, Value: firewall }]

  FirewallBSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.255.0.64/26
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${Name}-firewall-b" }, { Key: Tier, Value: firewall }]

  FirewallCSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.255.0.128/26
      AvailabilityZone: !Select [2, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${Name}-firewall-c" }, { Key: Tier, Value: firewall }]

  PublicASubnet:
    Type: AWS::EC2::Subnet
    Properties:
