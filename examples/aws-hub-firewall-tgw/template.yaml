      CidrBlock: 10.255.1.64/26
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${Name}-public-b" }, { Key: Tier, Value: public }]

  PublicCSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.255.1.128/26
      AvailabilityZone: !Select [2, !GetAZs ""]
      MapPublicIpOnLaunch: true
