# Generated by the jhooq.com VPC Subnet Planner - https://jhooq.com/tools/vpc-subnet-planner/
AWSTemplateFormatVersion: "2010-09-09"
Description: 172.16.0.0/16 - 3 tiers x 2 AZs

Parameters:
  Name:
    Type: String
    Default: jhooq-vpc

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 172.16.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref Name }]

  AppASubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 172.16.0.0/21
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${Name}-app-a" }, { Key: Tier, Value: app }]

  AppBSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 172.16.8.0/21
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${Name}-app-b" }, { Key: Tier, Value: app }]

  WebASubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 172.16.32.0/25
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${Name}-web-a" }, { Key: Tier, Value: web }]

  WebBSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 172.16.32.128/25
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${Name}-web-b" }, { Key: Tier, Value: web }]

  DbASubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 172.16.34.0/26
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${Name}-db-a" }, { Key: Tier, Value: db }]

  DbBSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 172.16.34.64/26
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${Name}-db-b" }, { Key: Tier, Value: db }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref VPC, InternetGatewayId: !Ref InternetGateway }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub "${Name}-public-rt" }] }
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties: { RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  WebASubnetAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref WebASubnet, RouteTableId: !Ref PublicRouteTable }
  WebBSubnetAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref WebBSubnet, RouteTableId: !Ref PublicRouteTable }

  NatEip0:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  Nat0:
    Type: AWS::EC2::NatGateway
    Properties: { AllocationId: !GetAtt NatEip0.AllocationId, SubnetId: !Ref WebASubnet }
  PrivateRouteTable0:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VPC }
  PrivateRoute0:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PrivateRouteTable0, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref Nat0 }
  AppASubnetAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppASubnet, RouteTableId: !Ref PrivateRouteTable0 }

  NatEip1:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  Nat1:
    Type: AWS::EC2::NatGateway
    Properties: { AllocationId: !GetAtt NatEip1.AllocationId, SubnetId: !Ref WebBSubnet }
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VPC }
  PrivateRoute1:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PrivateRouteTable1, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref Nat1 }
  AppBSubnetAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppBSubnet, RouteTableId: !Ref PrivateRouteTable1 }

Outputs:
  VpcId:
    Value: !Ref VPC
